server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: moying

  datasource:
    url: jdbc:mysql://localhost:3306/moying?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        #dialect: org.hibernate.dialect.MySQLDialect

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

langchain4j:
  open-ai:
    chat-model:
      api-key: ${OPENAI_API_KEY:your-openai-api-key}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model-name: qwen3.7-plus
      temperature: 0.7
      max-tokens: 16384
      timeout: 120s
      log-requests: true
      log-responses: true

app:
  screenplay:
    #max-chapters-per-batch: 5
    yaml-indent: 2
    fallback-to-rules: true

  prompts:
    screenplay-conversion: classpath:prompts/conversion-system.txt
    #scene-refinement: classpath:prompts/scene-refinement.txt

logging:
  level:
    com.moying: DEBUG
    dev.langchain4j: DEBUG
